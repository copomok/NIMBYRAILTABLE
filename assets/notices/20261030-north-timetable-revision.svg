<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080">
  <style>
    .brand{font:700 14px Arial,sans-serif;letter-spacing:2px;fill:#2456a6}.title{font:800 34px 'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#151515}.sub{font:500 18px 'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#53565a}.section{font:800 22px 'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#171717}.big{font:850 30px 'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#1f5cb8}.label{font:700 17px 'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#24272c}.body{font:600 16px 'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#34383e}.small{font:500 14px 'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#63666b}.white{fill:#fff}.grid{stroke:#c5c2ba;stroke-width:1}
  </style>
  <rect width="1440" height="1080" fill="#f4f1e9"/><rect x="38" y="38" width="1364" height="1004" rx="10" fill="#fff" stroke="#d3cec2" stroke-width="2"/>
  <text x="78" y="90" class="brand">NIMBYRAIL PASSENGER INFORMATION</text><text x="78" y="145" class="title">신의주–평양 일반열차 신설·시간표 조정</text><text x="78" y="184" class="sub">녕원 계통 정차시간 · 산내 경유 KTX 사진 템플릿 · 통과 표시 정정</text><text x="1362" y="145" text-anchor="end" class="small">2026-10-30</text>
  <rect x="78" y="225" width="398" height="170" rx="12" fill="#eef3fb" stroke="#b7c8e4"/><text x="106" y="267" class="section">신설 운행</text><text x="106" y="318" class="big">14회 왕복</text><text x="106" y="353" class="body">#5401~#5428 · 무궁화호</text><text x="106" y="380" class="small">7편성 · 당일 원 기점 복귀</text>
  <rect x="501" y="225" width="398" height="170" rx="12" fill="#f3f8f3" stroke="#b9d3be"/><text x="529" y="267" class="section">일반열차 통합 간격</text><text x="529" y="318" class="big">20~43분</text><text x="529" y="353" class="body">하행 20~40분 · 상행 20~43분</text><text x="529" y="380" class="small">KTX 제외, 안전 검증에는 KTX 포함</text>
  <rect x="924" y="225" width="438" height="170" rx="12" fill="#fff5ec" stroke="#e3c4a4"/><text x="952" y="267" class="section">검증 결과</text><text x="952" y="318" class="big">무단추월 0건</text><text x="952" y="353" class="body">1,907편 · 35,943개 시각 구간</text><text x="952" y="380" class="small">시간 역전·운용표 결함도 0건</text>
  <rect x="78" y="445" width="1284" height="48" rx="8" fill="#30343b"/><text x="102" y="477" class="section white">주요 신설·조정 내용</text><rect x="78" y="493" width="1284" height="286" fill="#fff" stroke="#777"/><line x1="440" y1="493" x2="440" y2="779" class="grid"/><line x1="78" y1="565" x2="1362" y2="565" class="grid"/><line x1="78" y1="637" x2="1362" y2="637" class="grid"/><line x1="78" y1="709" x2="1362" y2="709" class="grid"/><rect x="78" y="565" width="1284" height="72" fill="#faf9f6"/><rect x="78" y="709" width="1284" height="70" fill="#faf9f6"/>
  <text x="102" y="536" class="label">신의주–평양</text><text x="466" y="536" class="body">일반열차 사이에 무궁화호 14왕복을 배치하고 KTX 추월은 정차역 대피로 처리</text><text x="102" y="608" class="label">녕원–평양·서울</text><text x="466" y="608" class="body">사진의 도착·출발 초를 각각 버려 1분 미만 정차를 정상 정차시간으로 복원</text><text x="102" y="680" class="label">신의주–서울 KTX</text><text x="466" y="680" class="body">#9001~#9018 문산·룡천 시각 유지, 0분 정차 표기를 통과로 전환</text><text x="102" y="752" class="label">산내 경유 KTX</text><text x="466" y="752" class="body">총 소요시간을 별도 고정하지 않고 사진의 양방향 역별 시각과 통과점을 적용</text>
  <rect x="78" y="829" width="1284" height="126" rx="10" fill="#eef3fb" stroke="#b7c8e4"/><circle cx="106" cy="864" r="5" fill="#2456a6"/><text x="124" y="870" class="body">기존 열차 68편은 역별 시간표 또는 통과 표시를 정정했고, 그중 23편의 시발역 출발 시각이 바뀌었습니다.</text><circle cx="106" cy="904" r="5" fill="#2456a6"/><text x="124" y="910" class="body">통과 시각이 없는 1,270개 구간은 구간 추월 판정을 할 수 없어 검사 대상에서 제외했습니다.</text><circle cx="106" cy="944" r="5" fill="#2456a6"/><text x="124" y="950" class="body">열차별 기존·변경 출발 시각은 앱 공지의 전체 변경 보고서에서 확인할 수 있습니다.</text><text x="78" y="1001" class="small">※ 실제 탑승 전 열차 상세 화면의 최신 역별 시각과 승강장을 확인해 주세요.</text>
</svg>
