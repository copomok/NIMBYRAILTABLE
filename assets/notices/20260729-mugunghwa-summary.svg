  </style><rect width="1440" height="730" fill="#f4f1e9"/><rect x="38" y="38" width="1364" height="654" rx="8" fill="#fff" stroke="#d3cec2" stroke-width="2"/><text x="78" y="90" class="brand">NIMBYRAIL PASSENGER INFORMATION</text><text x="78" y="142" class="title">[붙임] 무궁화호 신설 계통 요약</text><text x="78" y="181" class="subtitle">서울·영동·목포에서 남대구·부산 방면</text><text x="1362" y="142" text-anchor="end" class="date">2026-07-29 기준</text><rect x="78" y="220" width="1284" height="42" rx="9" fill="#2456a6" opacity=".10"/><rect x="78" y="220" width="9" height="42" rx="5" fill="#2456a6"/><text x="102" y="249" class="section">새로 운행하는 열차</text><rect x="78" y="274" width="1284" height="212" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="78" y="274" width="1284" height="56" fill="#30343b"/><text x="238.5" y="307" text-anchor="middle" class="th headerText"><tspan x="238.5" dy="0">계통</tspan></text><text x="559.5" y="307" text-anchor="middle" class="th headerText"><tspan x="559.5" dy="0">열차번호</tspan></text><line x1="399" y1="274" x2="399" y2="330" class="grid"/><text x="880.5" y="307" text-anchor="middle" class="th headerText"><tspan x="880.5" dy="0">운행 횟수</tspan></text><line x1="720" y1="274" x2="720" y2="330" class="grid"/><text x="1201.5" y="307" text-anchor="middle" class="th headerText"><tspan x="1201.5" dy="0">이용 안내</tspan></text><line x1="1041" y1="274" x2="1041" y2="330" class="grid"/><line x1="78" y1="330" x2="1362" y2="330" class="grid"/><rect x="78" y="330" width="6" height="46" fill="#2456a6"/><text x="238.5" y="358" text-anchor="middle" class="td"><tspan x="238.5" dy="0">서울 ↔ 남대구(조치원·세종)</tspan></text><text x="559.5" y="358" text-anchor="middle" class="td"><tspan x="559.5" dy="0">#1311~#1328</tspan></text><line x1="399" y1="330" x2="399" y2="376" class="grid"/><text x="880.5" y="358" text-anchor="middle" class="td"><tspan x="880.5" dy="0">9회 왕복</tspan></text><line x1="720" y1="330" x2="720" y2="376" class="grid"/><text x="1201.5" y="358" text-anchor="middle" class="td"