="103" cy="1082" r="5" fill="#2456a6"/><text x="120" y="1088" class="callout">#1214는 17:53에서 17:52로, #1642는 13:52에서 13:55로 전수 검증 과정에서 다시 조정됐습니다.</text><circle cx="103" cy="1116" r="5" fill="#2456a6"/><text x="120" y="1122" class="callout">정규 부산→서울 KTX 15~25분 배차 · 예외 10~30분 구간에는 다른 경부고속선 KTX가 있습니다.</text><circle cx="103" cy="1150" r="5" fill="#2456a6"/><text x="120" y="1156" class="callout">산내 정차 상행 KTX 7편의 병목안→서울 운전시분을 7분으로 정정했습니다.</text><circle cx="103" cy="1184" r="5" fill="#2456a6"/><text x="120" y="1190" class="callout">통과 시각이 없는 인접 구간 1,270개는 검증 대상에서 제외했습니다.</text><circle cx="103" cy="1218" r="5" fill="#2456a6"/><text x="120" y="1224" class="callout">무단 추월이 없는 일부 3분 미만 간격은 기존대로 유지했습니다.</text><text x="78" y="1298" class="foot">※ 실제 운행 시각은 앱의 열차 상세 시간표에서 다시 확인해 주세요.</text></svg>